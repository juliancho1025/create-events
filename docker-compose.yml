services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # S3-compatible object storage for event images (local stand-in for AWS S3).
  # MinIO no longer publishes community Docker images, so SeaweedFS is used instead.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=10
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

volumes:
  mongo-data:
  s3-data:
